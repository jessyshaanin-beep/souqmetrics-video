name: Render SouqMetrics 3D Preview Stills

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify Remotion assets
        run: |
          echo "Assets already live in public/assets:"
          ls -lah public/assets

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Create preview folder
        run: mkdir -p preview-stills

      - name: Render early floating scene
        run: |
          npx remotion still \
            src/index.ts \
            SouqMetricsVerticalAd \
            preview-stills/early.png \
            --frame=60 \
            --width=1080 \
            --height=1350

      - name: Render absorption scene
        run: |
          npx remotion still \
            src/index.ts \
            SouqMetricsVerticalAd \
            preview-stills/absorption.png \
            --frame=105 \
            --width=1080 \
            --height=1350

      - name: Render post-processing scene
        run: |
          npx remotion still \
            src/index.ts \
            SouqMetricsVerticalAd \
            preview-stills/post-processing.png \
            --frame=265 \
            --width=1080 \
            --height=1350

      - name: Render final frame
        run: |
          npx remotion still \
            src/index.ts \
            SouqMetricsVerticalAd \
            preview-stills/final.png \
            --frame=410 \
            --width=1080 \
            --height=1350

      - name: Show rendered files
        run: |
          echo "Rendered preview stills:"
          find preview-stills -type f -exec ls -lh {} \;

      - name: Upload preview stills
        uses: actions/upload-artifact@v4
        with:
          name: souqmetrics-3d-preview-stills
          path: preview-stills/
          retention-days: 7
          if-no-files-found: error
